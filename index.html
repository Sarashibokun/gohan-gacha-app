<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のメシガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #191510;
    --bg2: #12100c;
    --paper: #f4ecd8;
    --paper-dim: #e8dcbc;
    --ink: #241d14;
    --ink-soft: #5a4f3d;
    --lantern: #c0392b;
    --lantern-deep: #8f2a1f;
    --gold: #d9a441;
    --green: #4a7c59;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% -10%, #2a2116 0%, var(--bg) 45%, var(--bg2) 100%);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 18px 60px;
  }
  .noren{
    position:fixed; top:0; left:0; right:0; height:14px;
    background: repeating-linear-gradient(90deg, var(--lantern-deep) 0 2px, transparent 2px 46px);
    opacity:.55;
  }
  header{ text-align:center; margin: 22px 0 30px; }
  .eyebrow{ letter-spacing: .35em; font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 10px; }
  h1{
    font-family: 'Shippori Mincho', serif; font-weight: 800;
    font-size: clamp(28px, 7vw, 42px); margin: 0; letter-spacing: .04em;
    text-shadow: 0 2px 18px rgba(192,57,43,.25);
  }
  .sub{ margin-top: 10px; font-size: 13px; color: #cfc4a8; }

  .filter-box{
    width: min(400px, 90vw); background: rgba(244,236,216,.06);
    border: 1px solid rgba(244,236,216,.16); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 22px;
  }
  .filter-box .section-title{ color: var(--gold); margin-bottom: 8px; }
  .filter-row{ display:flex; flex-direction: column; gap:10px; }
  .filter-row input{
    width: 100%; border: 1px solid rgba(244,236,216,.25); border-radius: 10px; padding: 10px 12px;
    font-family: inherit; font-size: 13px; background: rgba(255,255,255,.92); color: var(--ink);
  }
  .filter-buttons{ display:flex; gap:8px; }
  .filter-buttons button{
    flex:1; appearance:none; border:none; font-family: inherit; font-weight: 700; font-size: 12.5px;
    padding: 10px 8px; border-radius: 10px; cursor:pointer; white-space: nowrap;
  }
  .filter-buttons button.apply{ background: var(--lantern); color: #fbe9c9; }
  .filter-buttons button.clear{ background: rgba(244,236,216,.12); color: var(--paper); border: 1px solid rgba(244,236,216,.2); }
  .filter-status{ font-size: 12px; color: #cfc4a8; margin-top: 8px; min-height: 16px; }

  .stage{ position: relative; width: min(400px, 90vw); }

  .card{
    background: var(--paper); color: var(--ink); border-radius: 18px;
    padding: 28px 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.45);
    position: relative; min-height: 260px;
  }
  .card.spinning{ animation: shake .09s linear infinite; }
  @keyframes shake{
    0%{ transform: rotate(0deg) translateX(0);}
    25%{ transform: rotate(-1.2deg) translateX(-2px);}
    75%{ transform: rotate(1.2deg) translateX(2px);}
    100%{ transform: rotate(0deg) translateX(0);}
  }

  .top-row{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 14px; }
  .tag{
    font-size: 11px; letter-spacing:.15em; color: var(--lantern); font-weight: 700;
    background: rgba(192,57,43,.08); border: 1px solid rgba(192,57,43,.25);
    padding: 4px 10px; border-radius: 100px;
  }
  .time-badge{
    font-size: 11.5px; font-weight: 700; color: var(--green);
    background: rgba(74,124,89,.1); border: 1px solid rgba(74,124,89,.28);
    padding: 4px 10px; border-radius: 100px;
  }

  .head{ text-align:center; margin-bottom: 12px; }
  .emoji{ font-size: 64px; line-height:1; margin-bottom: 8px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
  .name-jp{ font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 24px; margin: 0 0 3px; }
  .name-en{ font-size: 11px; letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 10px; }
  .caption{ font-size: 13.5px; line-height: 1.6; color: #3a2f20; text-align:center; margin-bottom: 12px; }
  .hashtags{ font-size: 12px; color: var(--lantern-deep); font-weight: 700; display:flex; flex-wrap:wrap; gap: 6px 10px; justify-content:center; margin-bottom: 8px; }

  .divider{ border:none; border-top: 1px dashed rgba(36,29,20,.2); margin: 14px 0; }

  .section-title{ font-size: 12.5px; font-weight: 800; color: var(--ink); margin: 0 0 8px; letter-spacing: .04em; }
  ul.ingredients{ list-style:none; padding:0; margin: 0 0 4px; font-size: 13.5px; }
  ul.ingredients li{
    display:flex; justify-content: space-between; padding: 5px 0;
    border-bottom: 1px dotted rgba(36,29,20,.14);
  }
  ul.ingredients li span.amt{ color: var(--ink-soft); }

  ol.steps{ padding-left: 20px; margin: 0; font-size: 13.5px; line-height: 1.7; }
  ol.steps li{ margin-bottom: 6px; }
  .servings-note{ font-size: 11px; color: var(--ink-soft); margin: 4px 0 10px; }

  .actions{ display:flex; gap: 10px; margin-top: 16px; }
  .mini-btn{
    flex:1; appearance:none; border: 1px solid rgba(36,29,20,.2); background: rgba(255,255,255,.4);
    color: var(--ink); font-family: inherit; font-weight: 700; font-size: 12.5px;
    padding: 10px 8px; border-radius: 10px; cursor:pointer; transition: background .15s ease;
  }
  .mini-btn:hover{ background: rgba(255,255,255,.75); }
  .mini-btn.saved{ background: var(--green); color: #fff; border-color: var(--green); }

  .placeholder{ text-align:center; color: var(--ink-soft); padding: 30px 0; }
  .placeholder .emoji{ font-size: 56px; opacity:.5; }

  .btn{
    margin-top: 26px; appearance:none; border:none; cursor:pointer;
    background: linear-gradient(180deg, var(--lantern) 0%, var(--lantern-deep) 100%);
    color: #fbe9c9; font-family: inherit; font-weight: 900; font-size: 15.5px; letter-spacing: .06em;
    padding: 15px 38px; border-radius: 100px;
    box-shadow: 0 10px 24px rgba(192,57,43,.35), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .08s ease, box-shadow .2s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px rgba(192,57,43,.45); }
  .btn:active{ transform: translateY(1px) scale(.98); }
  .hint{ margin-top: 12px; font-size: 11px; color: #8b8069; }

  .saved-toggle{
    margin-top: 30px; background:none; border: 1px solid rgba(244,236,216,.25); color: var(--paper);
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 18px;
    border-radius: 100px; cursor:pointer;
  }
  .saved-panel{
    width: min(400px, 90vw); margin-top: 16px; background: rgba(244,236,216,.06);
    border: 1px solid rgba(244,236,216,.14); border-radius: 14px; padding: 14px 16px; display:none;
  }
  .saved-panel.open{ display:block; }
  .saved-panel h3{ font-size: 13px; margin: 0 0 10px; color: var(--gold); letter-spacing: .04em; }
  .saved-item{
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(244,236,216,.1); font-size: 13px;
  }
  .saved-item:last-child{ border-bottom:none; }
  .saved-item .label{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .saved-item button{
    background:none; border:none; color: #c98a80; font-size: 12px; cursor:pointer; font-weight:700;
    flex-shrink: 0; white-space: nowrap;
  }
  .empty-note{ font-size: 12.5px; color: #a89a7c; }

  footer{ margin-top: 36px; font-size: 10.5px; color: #6b604c; text-align:center; letter-spacing: .05em; }
</style>
</head>
<body>
<div class="noren"></div>

<header>
  <div class="eyebrow">TONIGHT'S MENU GACHA</div>
  <h1>今日のメシ、決めよう</h1>
  <div class="sub">材料・作り方・調理時間つきでランダムに1品</div>
</header>

<div class="filter-box">
  <div class="section-title">🥕 食材・ジャンルで絞り込む</div>
  <div class="filter-row">
    <input type="text" id="filterInput" placeholder="例：豚肉, もやし, 炊飯器, 揚げない（カンマ区切り）">
    <div class="filter-buttons">
      <button class="apply" id="filterApply">絞り込む</button>
      <button class="clear" id="filterClear">クリア</button>
    </div>
  </div>
  <div class="filter-status" id="filterStatus"></div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="placeholder">
      <div class="emoji">🍽</div>
      <div class="name-jp">— お品書き待機中 —</div>
      <div class="caption">ボタンを押して、今夜の一品を引いてみて</div>
    </div>
  </div>
</div>

<button class="btn" id="gachaBtn">メニューを引く</button>
<div class="hint" id="hint">同じ皿が連続で出ることもあるよ（ご愛嬌）</div>

<button class="saved-toggle" id="savedToggle">♡ 保存したレシピを見る</button>
<div class="saved-panel" id="savedPanel">
  <h3>保存済みメニュー</h3>
  <div id="savedList"><div class="empty-note">まだ保存したレシピはないよ</div></div>
</div>

<footer>54品（定番／創作・時短／揚げない／鍋ひとつ／炊飯器だけ）の中からランダムに1品セレクト・材料は2人分目安</footer>

const card = document.getElementById('card');
const btn = document.getElementById('gachaBtn');
const hint = document.getElementById('hint');
const savedToggle = document.getElementById('savedToggle');
const savedPanel = document.getElementById('savedPanel');
const savedList = document.getElementById('savedList');

let current = null;
let filterKeywords = [];

const STORAGE_KEY = 'gohanGachaSaved';

function loadSavedMap(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return new Map(Object.entries(obj));
  }catch(e){
    console.error('failed to read localStorage', e);
    return new Map();
  }
}

function persistSavedMap(map){
  try{
    const obj = Object.fromEntries(map);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    return true;
  }catch(e){
    console.error('failed to write localStorage', e);
    return false;
  }
}

const memoryFallback = loadSavedMap(); // id -> item, backed by localStorage for real persistence

const filterInput = document.getElementById('filterInput');
const filterApply = document.getElementById('filterApply');
const filterClear = document.getElementById('filterClear');
const filterStatus = document.getElementById('filterStatus');

function getPool(){
  if(filterKeywords.length === 0) return MENU;
  const matched = MENU.filter(item => {
    const ingMatch = item.ing.some(([name]) =>
      filterKeywords.some(k => name.toLowerCase().includes(k.toLowerCase()))
    );
    const tagMatch = (item.tags || []).some(tag => {
      const cleanTag = tag.replace(/^#/, '').toLowerCase();
      return filterKeywords.some(k => cleanTag.includes(k.toLowerCase()));
    });
    return ingMatch || tagMatch;
  });
  return matched.length > 0 ? matched : null; // null = no match
}

function updateFilterStatus(){
  if(filterKeywords.length === 0){
    filterStatus.textContent = '';
    return;
  }
  const pool = getPool();
  if(pool === null){
    filterStatus.textContent = `⚠️「${filterKeywords.join('・')}」を使うメニューが見つからなかった。条件を減らすか別の食材で試してみて。`;
  }else{
    filterStatus.textContent = `🎯 「${filterKeywords.join('・')}」を含む ${pool.length}品に絞り込み中`;
  }
}

filterApply.addEventListener('click', () => {
  const raw = filterInput.value.trim();
  filterKeywords = raw ? raw.split(/[,、\s]+/).filter(Boolean) : [];
  updateFilterStatus();
});
filterInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') filterApply.click();
});
filterClear.addEventListener('click', () => {
  filterKeywords = [];
  filterInput.value = '';
  updateFilterStatus();
});

function renderCard(item, withDetails){
  const ingHtml = item.ing.map(([name, amt]) => `<li>${name}<span class="amt">${amt}</span></li>`).join('');
  const stepHtml = item.steps.map(s => `<li>${s}</li>`).join('');
  card.innerHTML = `
    <div class="top-row">
      <div class="tag">TODAY'S PICK</div>
      <div class="time-badge">⏱ ${item.time}</div>
    </div>
    <div class="head">
      <div class="emoji">${item.emoji}</div>
      <div class="name-jp">${item.jp}</div>
      <div class="name-en">${item.en}</div>
      <div class="caption">${item.cap}</div>
      <div class="hashtags">${item.tags.map(t => `<span>${t}</span>`).join('')}</div>
    </div>
    <hr class="divider">
    <div class="section-title">材料（2人分目安）</div>
    <div class="servings-note">分量はお好みで調整してね</div>
    <ul class="ingredients">${ingHtml}</ul>
    <div class="section-title" style="margin-top:14px;">作り方</div>
    <ol class="steps">${stepHtml}</ol>
    <div class="actions">
      <button class="mini-btn" id="saveBtn">♡ 保存する</button>
    </div>
    <div id="saveError" style="color:#c0392b; font-size:11.5px; margin-top:6px; display:none;"></div>
  `;
  document.getElementById('saveBtn').addEventListener('click', () => saveRecipe(item));
  checkSaved(item.id);
}

function saveRecipe(item){
  const btn2 = document.getElementById('saveBtn');
  memoryFallback.set(item.id, item);
  persistSavedMap(memoryFallback);
  if(btn2){ btn2.textContent = '♥ 保存済み'; btn2.classList.add('saved'); }
  refreshSavedList();
}

function checkSaved(id){
  const btn2 = document.getElementById('saveBtn');
  if(!btn2) return;
  if(memoryFallback.has(id)){
    btn2.textContent = '♥ 保存済み'; btn2.classList.add('saved');
  }
}

function refreshSavedList(){
  if(memoryFallback.size === 0){
    savedList.innerHTML = '<div class="empty-note">まだ保存したレシピはないよ</div>';
    return;
  }

  let html = '';
  memoryFallback.forEach((item) => {
    html += `<div class="saved-item">
      <span class="label" data-id="${item.id}">${item.emoji} ${item.jp}</span>
      <button data-del="${item.id}">削除</button>
    </div>`;
  });
  savedList.innerHTML = html;

  savedList.querySelectorAll('.label').forEach(el => {
    el.addEventListener('click', () => {
      const item = MENU.find(m => m.id === el.dataset.id);
      if(item){ renderCard(item, true); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  });
  savedList.querySelectorAll('button[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      memoryFallback.delete(el.dataset.del);
      persistSavedMap(memoryFallback);
      refreshSavedList();
      if(current && current.id === el.dataset.del) checkSaved(current.id);
    });
  });
}

let spinning = false;
btn.addEventListener('click', () => {
  if(spinning) return;
  const pool = getPool();
  if(pool === null){
    updateFilterStatus();
    return;
  }
  spinning = true;
  card.classList.add('spinning');
  let i = 0;
  const flicker = setInterval(() => {
    const r = pool[Math.floor(Math.random()*pool.length)];
    current = r;
    i++;
    if(i > 8){
      clearInterval(flicker);
      card.classList.remove('spinning');
      renderCard(r, true);
      spinning = false;
    }
  }, 70);
});

savedToggle.addEventListener('click', () => {
  savedPanel.classList.toggle('open');
  if(savedPanel.classList.contains('open')) refreshSavedList();
});
</script>
